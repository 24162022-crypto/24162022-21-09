<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quen mat khau</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Quen mat khau</h2>
    <p>Nhap email da dang ky, chung toi se gui ma OTP de dat lai mat khau.</p>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <label>Email</label>
        <input type="email" th:field="*{email}" placeholder="email@example.com" required autofocus>
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <button class="btn primary full mt" type="submit">Gui ma OTP</button>
    </form>

    <p class="mt"><a th:href="@{/login}">Quay lai dang nhap</a></p>
</div>
</body>
</html>
