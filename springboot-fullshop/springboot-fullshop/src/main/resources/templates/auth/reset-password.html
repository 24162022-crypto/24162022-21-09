<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dat lai mat khau</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Dat lai mat khau</h2>
    <p>Ma OTP da duoc gui toi email <strong th:text="${resetPasswordDTO.email}">email@example.com</strong>.</p>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <input type="hidden" th:field="*{email}">

        <label>Ma OTP (6 chu so)</label>
        <input type="text" th:field="*{code}" maxlength="6" placeholder="123456" required autofocus>
        <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>

        <label>Mat khau moi</label>
        <input type="password" th:field="*{newPassword}" placeholder="Toi thieu 6 ky tu" required>
        <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>

        <button class="btn primary full mt" type="submit">Dat lai mat khau</button>
    </form>
</div>
</body>
</html>
