<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xac thuc OTP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Xac thuc OTP</h2>
    <p>Ma OTP da duoc gui toi email <strong th:text="${verifyOtpDTO.email}">email@example.com</strong>.
       Vui long kiem tra hop thu (ke ca thu muc spam).</p>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <input type="hidden" th:field="*{email}">

        <label>Ma OTP (6 chu so)</label>
        <input type="text" th:field="*{code}" maxlength="6" placeholder="123456" required autofocus>
        <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>

        <button class="btn primary full mt" type="submit">Xac thuc</button>
    </form>

    <form th:action="@{/register/resend-otp}" method="post" class="mt">
        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
        <button class="btn secondary full" type="submit">Gui lai ma OTP</button>
    </form>
</div>
</body>
</html>
