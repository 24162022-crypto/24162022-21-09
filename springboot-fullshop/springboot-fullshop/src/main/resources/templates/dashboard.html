<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Dashboard</title>
</head>
<body>
<main layout:fragment="content">
    <div class="page-title">
        <h1>Dashboard</h1>
    </div>

    <div class="cards">
        <div class="card">
            <b>Tong so nguoi dung</b>
            <strong th:text="${totalUsers}">0</strong>
        </div>
        <div class="card">
            <b>Tong so san pham</b>
            <strong th:text="${totalProducts}">0</strong>
        </div>
    </div>

    <div class="mt">
        <a class="btn secondary" th:href="@{/users}">Quan ly nguoi dung</a>
        <a class="btn secondary" th:href="@{/products}">Quan ly san pham</a>
    </div>
</main>
</body>
</html>
